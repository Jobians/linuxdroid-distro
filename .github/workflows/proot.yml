name: ARM64 PRoot-Distro

on:
  push:
  workflow_dispatch:

jobs:
  proot:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install PRoot and Python
        run: |
          sudo apt update
          sudo apt install -y proot python3 python3-pip

      - name: Install PRoot-Distro
        run: |
          python3 -m pip install --user proot-distro --break-system-packages
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check architecture
        run: |
          uname -m
          uname -a
          proot --version
          proot-distro --help

      - name: Install Debian
        run: |
          proot-distro install debian:13.6-slim

      - name: Enter Debian
        env:
          PROOT_NO_SECCOMP: "1"
        run: |
          unset LD_PRELOAD
          proot-distro login debian
          
