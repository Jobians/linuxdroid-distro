name: Build Minimal Debian 13 ARM64 RootFS Tarballs (.tar.gz)

on:
  push:
  workflow_dispatch:

jobs:
  build-variant:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1-vanilla"
            filename: "debian-13-slim-vanilla.tar.gz"
            install_script: |
              echo "No additional packages installed."

          - name: "2-pio"
            filename: "debian-13-slim-pio.tar.gz"
            install_script: |
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-pip python3-venv git curl ca-certificates unzip
              python3 -m pip install --break-system-packages platformio

          - name: "3-pio-arduino"
            filename: "debian-13-slim-pio-arduino.tar.gz"
            install_script: |
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-pip python3-venv git curl ca-certificates unzip
              python3 -m pip install --break-system-packages platformio
              # Install Arduino AVR platform & Arduino CLI
              pio platform install atmelavr
              curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

          - name: "4-pio-esp32"
            filename: "debian-13-slim-pio-esp32.tar.gz"
            install_script: |
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-pip python3-venv git curl ca-certificates unzip
              python3 -m pip install --break-system-packages platformio
              # Install ESP32 platform
              pio platform install espressif32

          - name: "5-pio-arduino-esp32"
            filename: "debian-13-slim-pio-arduino-esp32.tar.gz"
            install_script: |
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-pip python3-venv git curl ca-certificates unzip
              python3 -m pip install --break-system-packages platformio
              # Install both AVR (Arduino) and ESP32 platforms & Arduino CLI
              pio platform install atmelavr espressif32
              curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

    steps:
      - name: Build Container and Install Packages
        run: |
          echo "--> Starting base container for variant: ${{ matrix.name }}"
          docker run --name builder debian:13-slim bash -c "
            set -e
            ${{ matrix.install_script }}
            # Clean apt caches, temp files, and remove .dockerenv
            apt-get clean
            rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
            rm -f /.dockerenv
          "

      - name: Export RootFS to .tar.gz
        run: |
          echo "--> Exporting rootfs and compressing to ${{ matrix.filename }}..."
          docker export builder | gzip -9 > ${{ matrix.filename }}

          echo "--> Cleaning up container..."
          docker rm builder

      - name: Inspect Tarball Contents & Size
        run: |
          echo "=== File Size ==="
          ls -lh ${{ matrix.filename }}

          echo ""
          echo "=== Top-level directory structure ==="
          tar -ztf ${{ matrix.filename }} | cut -d/ -f1 | sort -u

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.filename }}
          retention-days: 7
