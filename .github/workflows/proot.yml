name: Build Debian 13 ARM64 RootFS for PRoot

on:
  push:
  workflow_dispatch:

jobs:
  build-tarball:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Export Debian 13-slim RootFS from Docker
        run: |
          echo "--> Creating container from debian:13-slim..."
          docker create --name debian_export debian:13-slim

          echo "--> Exporting root filesystem to tarball..."
          docker export debian_export -o debian-13-slim-rootfs.tar

          echo "--> Cleaning up container..."
          docker rm debian_export

      - name: Inspect Tarball Contents
        run: |
          echo "=== Top-level directory structure ==="
          tar -tf debian-13-slim-rootfs.tar | cut -d/ -f1 | sort -u

          echo ""
          echo "=== First 20 files in rootfs ==="
          tar -tvf debian-13-slim-rootfs.tar | head -n 20

      - name: Compress Tarball
        run: |
          echo "--> Compressing tarball with xz..."
          xz -z -9 -e -T0 debian-13-slim-rootfs.tar

          echo "--> Output details:"
          ls -lh debian-13-slim-rootfs.tar.xz

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-13-slim-arm64-rootfs
          path: debian-13-slim-rootfs.tar.xz
          retention-days: 7
